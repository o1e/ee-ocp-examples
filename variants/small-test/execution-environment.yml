---
version: 3

images:
  base_image:
    name: docker.io/library/python:3.12-slim-bookworm

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  exclude:
    system:
      - openshift-clients
  python_interpreter:
    python_path: /usr/local/bin/python3

options:
  package_manager_path: /usr/bin/apt-get

additional_build_files:
  - src: ../../include/sw_dl.sh
    dest: include/sw_dl.sh

additional_build_steps:
  prepend_base:
    - >-
      RUN apt-get update
      && apt-get install -y --no-install-recommends
      ca-certificates curl tar unzip
      && rm -rf /var/lib/apt/lists/*
    - COPY _build/include/sw_dl.sh /tmp/
    - >-
      RUN chmod +x /tmp/sw_dl.sh
      && /tmp/sw_dl.sh
      && rm -f /tmp/sw_dl.sh

  prepend_builder:
    - RUN apt-get update

  prepend_final:
    - RUN apt-get update

  append_final:
    - RUN rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
    - RUN test "$(python3 -c 'import sys; print(sys.executable)')" = "/usr/local/bin/python3"
    - RUN python3 --version
    - RUN ansible --version
    - RUN python3 -c "import libvirt, kubernetes, openshift"
    - RUN virsh --version
    - RUN virt-install --version
    - RUN qemu-img --version
