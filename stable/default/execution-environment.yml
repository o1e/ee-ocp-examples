---
version: 3

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: "--pre"

options:
  package_manager_path: /usr/bin/apt-get
  skip_pip_install: true

images:
  base_image:
    name: docker.io/library/python:3.13-slim-trixie
    # name: docker.io/library/python:3.12-slim-bookworm
dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
  ansible_core:
    package_pip: ansible-core
    # package_pip: ansible-core~=2.17.0
  ansible_runner:
    package_pip: ansible-runner
  exclude:
    system:
      - openshift-clients
  python_interpreter:
    python_path: /usr/local/bin/python3

additional_build_files:
  - src: ../../include/sw_dl.sh
    dest: include/sw_dl.sh

additional_build_steps:
  # Base stage: only install what you truly need early (git/curl/unzip + CA),
  # then cleanup apt lists to keep the image small.
  prepend_base:
    - >-
      RUN apt-get update
      && apt-get install -y --no-install-recommends
      git unzip curl ca-certificates
      && rm -rf /var/lib/apt/lists/*
    - COPY _build/include/sw_dl.sh /tmp/
    - >-
      RUN chmod +x /tmp/sw_dl.sh
      && /tmp/sw_dl.sh
      && rm -f /tmp/sw_dl.sh

  # Ensure apt indices exist before assemble installs bindep packages.
  prepend_builder:
    - RUN apt-get update

  # Ensure apt indices exist before install-from-bindep runs apt.
  prepend_final:
    - RUN apt-get update

  # Final cleanup + basic visibility
  append_final:
    - >-
      RUN for tool in virt-install virt-clone virt-xml; do
      if [ -x "/usr/bin/${tool}" ]; then
      printf '#!/bin/sh\nexec /usr/bin/python3 /usr/bin/%s "$@"\n' "${tool}" > "/usr/local/bin/${tool}";
      chmod +x "/usr/local/bin/${tool}";
      fi;
      done
    - RUN rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
    - RUN ansible --version
    - RUN python3 --version
    - RUN /usr/bin/python3 -c "import gi"
    - RUN python3 -c "import libvirt, lxml, pycdlib"
    - RUN virt-install --version
    - RUN ansible-doc community.libvirt.virt
    - RUN ansible-doc community.libvirt.virt_net
    - RUN ansible-doc community.libvirt.virt_volume
    - RUN ansible-doc containers.podman.podman_image
    - RUN ansible-doc containers.podman.podman_image_info
    - RUN podman --version
    - RUN skopeo --version
    - RUN qemu-img --version
    - RUN cloud-localds --help
